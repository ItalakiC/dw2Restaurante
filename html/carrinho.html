<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Carrinho - Página de Restaurante</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <link href="../css/style.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Fredoka:wght@300..700&family=Merriweather+Sans:ital,wght@0,300..800;1,300..800&family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Sniglet:wght@400;800&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Fredoka:wght@300..700&family=Merriweather+Sans:ital,wght@0,300..800;1,300..800&family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Sniglet:wght@400;800&display=swap" rel="stylesheet">
</head>

<body class="bg-light">
    <header class="bg-primary text-white text-center py-3">
        <h1 class="h3 mb-0">Restaurante</h1>
    </header>

    <main class="container py-4">
        <ul class="nav nav-tabs mb-4">
            <li class="nav-item"><a class="nav-link" href="index.html">Cardápio</a></li>
            <li class="nav-item"><a class="nav-link" href="gerenciar.html">Gerenciar cardápio</a></li>
            <li class="nav-item"><a class="nav-link active" href="carrinho.html">Carrinho <span class="badge bg-primary" id="contadorCarrinho">0</span></a></li>
        </ul>

        <div class="card mb-4">
            <div class="card-body">
                <h5 class="card-title">Itens do carrinho</h5>
                <div class="table-responsive">
                    <table class="table align-middle">
                        <thead>
                            <tr>
                                <th></th>
                                <th>Prato</th>
                                <th>Quantidade</th>
                                <th>Subtotal</th>
                                <th class="text-end">Ações</th>
                            </tr>
                        </thead>
                        <tbody id="listaCarrinho"></tbody>
                    </table>
                </div>
                <p class="text-muted text-center mb-0 d-none" id="vazioCarrinho">O carrinho está vazio. Volte ao cardápio para adicionar pratos.</p>
            </div>
        </div>

        <div class="card">
            <div class="card-body">
                <h5 class="card-title">Finalizar pedido</h5>
                <div class="alert alert-danger d-none" id="erroPedido" role="alert"></div>
                <form id="formPedido" novalidate>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="nomeCliente" class="form-label">Nome</label>
                            <input type="text" class="form-control" id="nomeCliente">
                        </div>
                        <div class="col-md-6">
                            <label for="telefone" class="form-label">Telefone</label>
                            <input type="text" class="form-control" id="telefone">
                        </div>
                    </div>

                    <div class="mt-3">
                        <label class="form-label d-block">Como vai ser?</label>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="tipoEntrega" id="tipoLocal" value="local" checked>
                            <label class="form-check-label" for="tipoLocal">Comer no local</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="tipoEntrega" id="tipoDelivery" value="delivery">
                            <label class="form-check-label" for="tipoDelivery">Delivery (taxa de R$ 2,50)</label>
                        </div>
                    </div>

                    <div class="mt-3 d-none" id="campoEndereco">
                        <label for="endereco" class="form-label">Endereço de entrega</label>
                        <input type="text" class="form-control" id="endereco">
                    </div>

                    <hr>
                    <div class="d-flex justify-content-between"><span>Subtotal</span><span id="subtotal"></span></div>
                    <div class="d-flex justify-content-between"><span>Taxa de entrega</span><span id="taxaEntrega"></span></div>
                    <p class="fs-4 fw-semibold text-primary mt-3 mb-0">Valor Total: <span id="valorTotal"></span></p>

                    <button type="submit" class="btn btn-primary mt-3 w-100">Finalizar pedido</button>
                </form>
            </div>
        </div>
    </main>

    <div class="modal fade" id="modalPedido" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Pedido realizado</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                </div>
                <div class="modal-body" id="resumoPedido"></div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary" data-bs-dismiss="modal">Fechar</button>
                </div>
            </div>
        </div>
    </div>


    <footer class = "rodape">
        &copy; Restaurante - Fins Acadêmicos Italo 2026
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>
    <script src="../js/models.js"></script>
    <script src="../js/carrinho.js"></script>
</body>

</html>
