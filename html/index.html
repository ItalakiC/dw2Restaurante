<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cardápio - Página de Restaurante</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <link href="../css/style.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Fredoka:wght@300..700&family=Merriweather+Sans:ital,wght@0,300..800;1,300..800&family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Sniglet:wght@400;800&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Fredoka:wght@300..700&family=Merriweather+Sans:ital,wght@0,300..800;1,300..800&family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Sniglet:wght@400;800&display=swap" rel="stylesheet">
</head>

<body class="bg-light">
    <header class="bg-primary text-white text-center py-3">
        <h1 class="h3 mb-0">Restaurante</h1>
    </header>

    <main class="container py-4">
        <ul class="nav nav-tabs mb-4">
            <li class="nav-item"><a class="nav-link active" href="index.html">Cardápio</a></li>
            <li class="nav-item"><a class="nav-link" href="gerenciar.html">Gerenciar cardápio</a></li>
            <li class="nav-item"><a class="nav-link" href="carrinho.html">Carrinho <span class="badge bg-primary" id="contadorCarrinho">0</span></a></li>
        </ul>

        <h5 class="text-center mb-3">Clique no prato para colocar no carrinho</h5>
        <!--não tendo data-bs-ride o carrosel não avança sozinho, só pelas setas -->
        <div id="carrosselPratos" class="carousel slide carousel-dark px-5 pb-5" data-bs-interval="false">
            <div class="carousel-inner" id="slides"></div>
            <button class="carousel-control-prev" type="button" data-bs-target="#carrosselPratos" data-bs-slide="prev">
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Anterior</span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#carrosselPratos" data-bs-slide="next">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Próximo</span>
            </button>
            <div class="carousel-indicators" id="indicadores"></div>
        </div>
        <p class="text-muted text-center d-none" id="vazioCardapio">Não há pratos no cardápio. Cadastre um prato primeiro.</p>
    </main>

    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="toastCarrinho" class="toast text-bg-primary" role="status" data-bs-delay="2000">
            <div class="toast-body" id="textoToast"></div>
        </div>
    </div>

    <footer class = "rodape">
        &copy; Restaurante - Fins Acadêmicos Italo 2026
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>
    <script src="../js/models.js"></script>
    <script src="../js/index.js"></script>
</body>

</html>
