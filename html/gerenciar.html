<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gerenciar cardápio - Página de Restaurante</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <link href="../css/style.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Fredoka:wght@300..700&family=Merriweather+Sans:ital,wght@0,300..800;1,300..800&family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Sniglet:wght@400;800&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Fredoka:wght@300..700&family=Merriweather+Sans:ital,wght@0,300..800;1,300..800&family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Sniglet:wght@400;800&display=swap" rel="stylesheet">
</head>

<body class="bg-light">
    <header class="bg-primary text-white text-center py-3">
        <h1 class="h3 mb-0">Restaurante</h1>
    </header>

    <main class="container py-4">
        <ul class="nav nav-tabs mb-4">
            <li class="nav-item"><a class="nav-link" href="index.html">Cardápio</a></li>
            <li class="nav-item"><a class="nav-link active" href="gerenciar.html">Gerenciar cardápio</a></li>
            <li class="nav-item"><a class="nav-link" href="carrinho.html">Carrinho <span class="badge bg-primary" id="contadorCarrinho">0</span></a></li>
        </ul>

        <div class="card mb-4">
            <div class="card-body">
                <h5 class="card-title" id="tituloFormulario">Novo prato</h5>
                <div class="alert alert-danger d-none" id="erroPrato" role="alert"></div>
                <form id="formPrato" novalidate>
                    <input type="hidden" id="pratoId">
                    <div class="row g-3">
                        <div class="col-md-5">
                            <label for="nome" class="form-label">Nome</label>
                            <input type="text" class="form-control" id="nome">
                        </div>
                        <div class="col-md-3">
                            <label for="preco" class="form-label">Preço (R$)</label>
                            <input type="number" step="0.01" min="0.01" class="form-control" id="preco">
                        </div>
                        <div class="col-md-4">
                            <label for="imagem" class="form-label">Imagem (link ou caminho)</label>
                            <input type="text" class="form-control" id="imagem">
                        </div>
                    </div>
                    <div class="mt-3">
                        <button type="submit" class="btn btn-primary" id="botaoSalvar">Salvar</button>
                        <button type="button" class="btn btn-secondary d-none" id="botaoCancelar">Cancelar</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="card">
            <div class="card-body">
                <h5 class="card-title">Pratos cadastrados</h5>
                <input type="text" class="form-control mb-3" id="busca" placeholder="Buscar prato por nome:">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead>
                            <tr>
                                <th></th>
                                <th>Nome</th>
                                <th>Preço</th>
                                <th class="text-end">Ações</th>
                            </tr>
                        </thead>
                        <tbody id="tabelaPratos"></tbody>
                    </table>
                </div>
                <p class="text-muted text-center mb-0 d-none" id="vazioPratos"></p>
            </div>
        </div>
    </main>

    <footer class = "rodape">
        &copy; Restaurante - Fins Acadêmicos Italo 2026
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4" crossorigin="anonymous"></script>
    <script src="../js/models.js"></script>
    <script src="../js/gerenciar.js"></script>
</body>

</html>
